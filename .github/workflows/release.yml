name: Release plugin

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish
        required: true
        type: string
      publish:
        description: Publish the package to GitHub Releases
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build and release linux/amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Build, verify, and package
        shell: bash
        env:
          GOOS: linux
          GOARCH: amd64
          EXTENSION: so
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          CGO_ENABLED=1 go build -trimpath -ldflags "-X main.pluginVersion=${version}" -buildmode=c-shared -o "dist/cpa-plugin-limit.${EXTENSION}" .
          python scripts/smoke_native.py "dist/cpa-plugin-limit.${EXTENSION}"
          python - "$version" "$GOOS" "$GOARCH" "$EXTENSION" <<'PY'
          import sys, zipfile
          version, os, arch, extension = sys.argv[1:]
          binary = f"cpa-plugin-limit.{extension}"
          with zipfile.ZipFile(f"dist/cpa-plugin-limit_{version}_{os}_{arch}.zip", "w", zipfile.ZIP_DEFLATED) as archive:
              archive.write(f"dist/{binary}", binary)
          PY
      - name: Generate checksums
        working-directory: dist
        run: sha256sum cpa-plugin-limit_*.zip > checksums.txt
      - name: Publish release
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/checksums.txt
