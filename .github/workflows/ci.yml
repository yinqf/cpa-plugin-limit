name: Test plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Test release version selection
        run: python3 -m unittest discover -s scripts -p 'test_release_version.py' -v
      - name: Build and exercise native ABI
        run: |
          mkdir -p build
          go build -buildmode=c-shared -o build/cpa-plugin-limit.so .
          python3 scripts/smoke_native.py build/cpa-plugin-limit.so
